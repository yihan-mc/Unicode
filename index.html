<!DOCTYPE html>
<html style="height: 100%" data-theme="system">
<head>
    <meta charset="UTF-8">
    <title>全 Unicode 平面查看器</title>
    <style>
        /* ===== 基础重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            transition: background 0.5s ease, color 0.5s ease;
        }
        :root {
            --bg-primary: #f5f6fa;
            --bg-secondary: #ffffff;
            --bg-toolbar: #f8f9fc;
            --bg-panel: #ffffff;
            --bg-header: #23262e;
            --text-primary: #1a1a2e;
            --text-secondary: #333333;
            --text-muted: #888888;
            --border-color: #dce1eb;
            --shadow-color: rgba(0, 0, 0, 0.12);
            --badge-bg: #eef2f7;
            --badge-text: #666666;
            --hover-bg: #f5f7fa;
            --table-header-bg: #eef2f7;
            --table-border: #d0d7e5;
            --row-hover: #f8faff;
            --ctrl-char-bg: #fff3e0;
            --ctrl-char-text: #b77a3a;
            --highlight-bg: #ffecb3;
            --highlight-shadow: #ffb300;
            --footer-border: #edf0f6;
            --footer-text: #aab3c8;
            --scrollbar-track: #f0f2f7;
            --scrollbar-thumb: #d0d7e5;
            --scrollbar-thumb-hover: #b8c2d4;
            --btn-primary-bg: #5fb8ff;
            --btn-primary-text: #ffffff;
            --btn-primary-hover: #3d9ee0;
            --btn-outline-border: #5fb8ff;
            --btn-outline-text: #5fb8ff;
            --btn-outline-hover: #eef6ff;
            --search-panel-bg: #ffffff;
            --search-panel-border: #dce1eb;
            --history-header-color: #888888;
            --history-item-hover: #f5f7fa;
            --history-empty-color: #b0b8c8;
            --candidate-section-bg: #fafbfc;
            --candidate-code-color: #888888;
            --disabled-opacity: 0.4;
            --transition-duration: 0.5s;
            --easing: ease;
            --nav-text: #ffffff;
            --nav-sub: rgba(255, 255, 255, 0.7);
            --toggle-bg: rgba(255, 255, 255, 0.12);
            --toggle-border: rgba(255, 255, 255, 0.2);
            --toggle-hover-bg: rgba(255, 255, 255, 0.2);
            --toggle-hover-border: rgba(255, 255, 255, 0.35);
            --toggle-icon-color: #ffffff;
            --row-highlight-bg: #e8f4ff;
            --row-highlight-first-bg: #d4e6ff;
        }
        [data-theme="dark"] {
            --bg-primary: #1a1a1e;
            --bg-secondary: #2a2a2e;
            --bg-toolbar: #2a2a2e;
            --bg-panel: #2a2a2e;
            --bg-header: #1a1a1e;
            --text-primary: #e8e8e8;
            --text-secondary: #cccccc;
            --text-muted: #999999;
            --border-color: #4a4a4e;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --badge-bg: #3a3a3e;
            --badge-text: #aaaaaa;
            --hover-bg: #3a3a3e;
            --table-header-bg: #3a3a3e;
            --table-border: #4a4a4e;
            --row-hover: #3a3a3e;
            --ctrl-char-bg: #5a3a2a;
            --ctrl-char-text: #d4a574;
            --highlight-bg: #5a4a2a;
            --highlight-shadow: #d4a030;
            --footer-border: #3a3a3e;
            --footer-text: #777777;
            --scrollbar-track: #2a2a2e;
            --scrollbar-thumb: #4a4a4e;
            --scrollbar-thumb-hover: #5a5a5e;
            --btn-primary-bg: #5fb8ff;
            --btn-primary-text: #ffffff;
            --btn-primary-hover: #3d9ee0;
            --btn-outline-border: #5fb8ff;
            --btn-outline-text: #5fb8ff;
            --btn-outline-hover: #2a4a6a;
            --search-panel-bg: #2a2a2e;
            --search-panel-border: #4a4a4e;
            --history-header-color: #999999;
            --history-item-hover: #3a3a3e;
            --history-empty-color: #666666;
            --candidate-section-bg: #3a3a3e;
            --candidate-code-color: #888888;
            --nav-text: #e8e8e8;
            --nav-sub: rgba(232, 232, 232, 0.7);
            --toggle-bg: rgba(255, 255, 255, 0.06);
            --toggle-border: rgba(255, 255, 255, 0.12);
            --toggle-hover-bg: rgba(255, 255, 255, 0.14);
            --toggle-hover-border: rgba(255, 255, 255, 0.25);
            --toggle-icon-color: #e8e8e8;
            --row-highlight-bg: #1a3a5c;
            --row-highlight-first-bg: #0d2b4a;
        }

        /* ===== 页面过渡（平滑） ===== */
        html {
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        .layui-header,
        .main_content,
        .toolbar,
        .pagination,
        #resultContainer,
        .footer-info,
        .layui-header .logo,
        .layui-header .sub,
        .page-title,
        .page-desc,
        .badge,
        .search-priority-hint,
        .pagination .info,
        .pagination .info strong,
        .vp-color-mode-switch {
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* ===== 按钮旋转动画 ===== */
        .vp-color-mode-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--toggle-border);
            background: var(--toggle-bg);
            color: var(--toggle-icon-color);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 0;
            outline: none;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            will-change: transform;
        }
        .vp-color-mode-switch:hover {
            background: var(--toggle-hover-bg);
            border-color: var(--toggle-hover-border);
            transform: scale(1.05);
        }
        .vp-color-mode-switch.spin {
            animation: spinOnce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes spinOnce {
            0% {
                transform: rotate(0deg) scale(1);
            }
            40% {
                transform: rotate(180deg) scale(1.12);
            }
            70% {
                transform: rotate(340deg) scale(0.95);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }
        .vp-color-mode-switch .icon-wrapper {
            position: relative;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vp-color-mode-switch .icon {
            position: absolute;
            width: 22px;
            height: 22px;
            display: block;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0;
            transform: scale(0.4) rotate(-35deg);
            transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }
        .vp-color-mode-switch .icon.active {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* ===== 布局 ===== */
        .layui-layout-admin {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .layui-header {
            background: var(--bg-header);
            color: var(--nav-text);
            height: 56px;
            line-height: 56px;
            padding: 0 24px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.5s ease, color 0.5s ease;
        }
        .layui-header .logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .layui-header .logo span {
            color: #5fb8ff;
        }
        .layui-header .sub {
            font-size: 13px;
            opacity: 0.7;
            color: var(--nav-sub);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .main_content {
            flex: 1;
            background: var(--bg-primary);
            padding: 20px 24px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease;
        }
        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color 0.5s ease;
        }
        .page-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
            transition: color 0.5s ease;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            background: var(--bg-toolbar);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.5s ease;
        }
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .toolbar label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-right: 2px;
            transition: color 0.5s ease;
        }
        .toolbar select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            outline: none;
            cursor: pointer;
            transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }
        .toolbar select:focus {
            border-color: #5fb8ff;
        }
        .toolbar input[type="text"] {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            width: 160px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            outline: none;
            transition: 0.2s, background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }
        .toolbar input[type="text"]:focus {
            border-color: #5fb8ff;
            box-shadow: 0 0 0 3px rgba(95, 184, 255, 0.2);
        }
        .toolbar .btn {
            padding: 6px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            transition: 0.2s;
        }
        .toolbar .btn:hover {
            background: var(--btn-primary-hover);
        }
        .toolbar .btn-outline {
            background: transparent;
            color: var(--btn-outline-text);
            border: 1px solid var(--btn-outline-border);
        }
        .toolbar .btn-outline:hover {
            background: var(--btn-outline-hover);
        }
        .toolbar .badge {
            margin-left: auto;
            font-size: 13px;
            color: var(--badge-text);
            background: var(--badge-bg);
            padding: 4px 14px;
            border-radius: 20px;
            white-space: nowrap;
            transition: background 0.5s ease, color 0.5s ease;
        }
        .search-options {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .search-options .opt-btn {
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 12px;
            background: var(--bg-secondary);
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.15s, background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
            user-select: none;
            white-space: nowrap;
        }
        .search-options .opt-btn:hover {
            background: var(--hover-bg);
        }
        .search-options .opt-btn.active {
            background: #5fb8ff;
            color: #fff;
            border-color: #5fb8ff;
            box-shadow: 0 1px 4px rgba(95, 184, 255, 0.3);
        }
        .search-options .opt-btn.active:hover {
            background: #3d9ee0;
            border-color: #3d9ee0;
        }
        .search-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .search-wrapper input[type="text"] {
            padding-right: 28px;
            width: 160px;
        }
        .search-wrapper .clear-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: var(--border-color);
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            display: none;
            transition: background 0.15s;
        }
        .search-wrapper .clear-btn:hover {
            background: #aab3c8;
        }
        .search-wrapper .clear-btn.visible {
            display: block;
        }
        .search-priority-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 4px;
            white-space: nowrap;
            transition: color 0.5s ease;
        }
        .search-panel {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            max-width: 360px;
            background: var(--search-panel-bg);
            border: 1px solid var(--search-panel-border);
            border-radius: 8px;
            box-shadow: 0 6px 20px var(--shadow-color);
            padding: 8px 0;
            z-index: 200;
            display: none;
            max-height: 400px;
            overflow-y: auto;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .search-panel.active {
            display: block;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px 6px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--history-header-color);
            transition: color 0.5s ease, border-color 0.5s ease;
        }
        .history-header .clear-all-btn {
            background: none;
            border: none;
            color: var(--border-color);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.15s;
        }
        .history-header .clear-all-btn:hover {
            color: #e74c3c;
        }
        .history-list {
            list-style: none;
            margin: 0;
            padding: 4px 0;
            max-height: 350px;
            overflow-y: auto;
        }
        .history-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.1s;
            color: var(--text-secondary);
        }
        .history-list li:hover {
            background: var(--history-item-hover);
        }
        .history-list li .history-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-list li .del-one-btn {
            background: none;
            border: none;
            color: var(--border-color);
            cursor: pointer;
            font-size: 13px;
            padding: 0 4px;
            transition: color 0.15s;
            margin-left: 8px;
        }
        .history-list li .del-one-btn:hover {
            color: #e74c3c;
        }
        .history-empty {
            padding: 12px;
            text-align: center;
            color: var(--history-empty-color);
            font-size: 13px;
            transition: color 0.5s ease;
        }
        .candidate-section {
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.5s ease;
        }
        .candidate-section:last-child {
            border-bottom: none;
        }
        .candidate-section .section-title {
            padding: 2px 12px 2px 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            background: var(--candidate-section-bg);
            transition: background 0.5s ease, color 0.5s ease;
        }
        .candidate-section .section-title .count-badge {
            font-weight: normal;
            color: var(--text-muted);
            margin-left: 6px;
            transition: color 0.5s ease;
        }
        .candidate-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .candidate-list li {
            display: flex;
            align-items: center;
            padding: 3px 12px 3px 24px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.1s;
            gap: 8px;
            color: var(--text-secondary);
        }
        .candidate-list li:hover {
            background: var(--history-item-hover);
        }
        .candidate-list li .candidate-char {
            font-size: 18px;
            width: 30px;
            text-align: center;
            flex-shrink: 0;
        }
        .candidate-list li .candidate-code {
            color: var(--candidate-code-color);
            font-family: monospace;
            font-size: 12px;
            transition: color 0.5s ease;
        }

        /* ===== 分页 ===== */
        .pagination {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: var(--bg-toolbar);
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            transition: background 0.5s ease;
        }
        .pagination .info {
            font-size: 14px;
            color: var(--text-secondary);
            transition: color 0.5s ease;
        }
        .pagination .info strong {
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .pagination input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }
        .pagination .btn {
            padding: 4px 14px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            background: var(--badge-bg);
            color: var(--text-secondary);
            transition: 0.2s, background 0.5s ease, color 0.5s ease;
        }
        .pagination .btn:hover {
            background: var(--border-color);
        }
        .pagination .btn-primary {
            background: #5fb8ff;
            color: #fff;
        }
        .pagination .btn-primary:hover {
            background: #3d9ee0;
        }
        .pagination .btn:disabled {
            opacity: var(--disabled-opacity);
            cursor: not-allowed;
            background: var(--badge-bg);
            color: var(--text-muted);
        }
        .pagination .btn:disabled:hover {
            background: var(--badge-bg);
        }
        /* 跳转标签颜色适配主题 */
        .jump-label {
            color: var(--text-secondary);
            transition: color 0.5s ease;
        }

        /* ===== 表格 ===== */
        #resultContainer {
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: border-color 0.5s ease;
        }
        .table-scroll-x {
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
        }
        #resultTable {
            width: 100%;
            min-width: 780px;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
            table-layout: fixed;
        }
        #resultHead {
            position: sticky;
            top: 0;
            z-index: 50;
        }
        #resultHead th {
            background: var(--table-header-bg) !important;
            color: var(--text-primary);
            font-weight: 600;
            padding: 10px 4px;
            text-align: center;
            border-bottom: 2px solid var(--table-border);
            position: sticky;
            top: 0;
            z-index: 50;
            white-space: nowrap;
            font-size: 13px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            height: 44px;
            vertical-align: middle;
            transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }
        #resultHead th:first-child {
            min-width: 52px;
            width: 52px;
            background: var(--table-header-bg) !important;
            border-right: 1px solid var(--table-border);
        }
        #resultHead th:not(:first-child) {
            width: calc((100% - 52px) / 16);
            min-width: 42px;
            background: var(--table-header-bg) !important;
        }
        #resultBody td {
            padding: 6px 2px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 13px;
            background: var(--bg-secondary);
            transition: background 0.1s, color 0.5s ease, border-color 0.5s ease;
            word-break: break-all;
            position: relative;
            color: var(--text-secondary);
        }
        #resultBody tr:hover td {
            background: var(--row-hover);
        }
        #resultBody td:first-child {
            background: var(--bg-toolbar);
            font-weight: 500;
            color: var(--text-muted);
            font-size: 12px;
            border-right: 1px solid var(--border-color);
            white-space: nowrap;
            transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }

        /* ===== 行高亮 — 使用 CSS 变量，日间浅蓝，夜间深蓝 ===== */
        #resultBody tr.highlight-row td {
            background: var(--row-highlight-bg) !important;
        }
        #resultBody tr.highlight-row td:first-child {
            background: var(--row-highlight-first-bg) !important;
        }

        .unicode_str {
            font-size: 18px;
            line-height: 1.6;
            min-height: 28px;
            color: var(--text-primary);
            font-family: "Segoe UI", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
            transition: color 0.5s ease;
        }
        .unicode_str .empty-placeholder {
            color: var(--text-muted);
            font-size: 12px;
            transition: color 0.5s ease;
        }
        .unicode_hex {
            font-size: 11px;
            color: var(--text-muted);
            font-family: "SF Mono", "Menlo", monospace;
            margin-top: 1px;
            transition: color 0.5s ease;
        }
        .unicode_decimal {
            font-size: 10px;
            color: var(--text-muted);
            font-family: "SF Mono", "Menlo", monospace;
            transition: color 0.5s ease;
        }
        .ctrl-char {

        /* ===== 滚动条 ===== */

    <script>
        (function() {
            'use strict';

            // ================================================================
            // 1. 主题切换模块（平滑过渡 + 按钮旋转，无 View Transition）
            // ================================================================

            const THEME_KEY = 'unicode_viewer_theme';
            const MODES = ['system', 'light', 'dark'];
            const htmlEl = document.documentElement;
            const switchBtn = document.getElementById('colorModeSwitch');

            function getSystemTheme() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function getEffectiveTheme(mode) {
                return mode === 'system' ? getSystemTheme() : mode;
            }

            function setActiveIcon(mode) {
                const autoIcon = switchBtn.querySelector('.auto-icon');
                const darkIcon = switchBtn.querySelector('.dark-icon');
                const lightIcon = switchBtn.querySelector('.light-icon');
                [autoIcon, darkIcon, lightIcon].forEach(el => el.classList.remove('active'));
                let target = null;
                if (mode === 'system') target = autoIcon;
                else if (mode === 'dark') target = darkIcon;
                else if (mode === 'light') target = lightIcon;
                if (target) {
                    requestAnimationFrame(() => {
                        target.classList.add('active');
                    });
                }
            }

            function applyTheme(mode, animate = false) {
                const effective = getEffectiveTheme(mode);
                htmlEl.setAttribute('data-theme', effective);
                localStorage.setItem(THEME_KEY, mode);
                setActiveIcon(mode);
                if (animate) {
                    switchBtn.classList.remove('spin');
                    void switchBtn.offsetWidth;
                    switchBtn.classList.add('spin');
                    switchBtn.addEventListener('animationend', function onEnd() {
                        switchBtn.classList.remove('spin');
                        switchBtn.removeEventListener('animationend', onEnd);
                    }, { once: true });
                }
            }

            function getCurrentMode() {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved && MODES.includes(saved)) return saved;
                return 'system';
            }

            function cycleTheme() {
                const current = getCurrentMode();
                const idx = MODES.indexOf(current);
                const next = MODES[(idx + 1) % MODES.length];
                applyTheme(next, true);
            }

            let mediaListener = null;

            function startSystemListener() {
                if (mediaListener) return;
                const media = window.matchMedia('(prefers-color-scheme: dark)');
                mediaListener = function() {
                    const mode = getCurrentMode();
                    if (mode === 'system') {
                        applyTheme('system', false);
                    }
                };
                media.addEventListener('change', mediaListener);
            }

            function initTheme() {
                const mode = getCurrentMode();
                applyTheme(mode, false);
                startSystemListener();
                switchBtn.addEventListener('click', cycleTheme);
            }

            // ================================================================
            // 2. Unicode 查看器（完整功能）
            // ================================================================

            const PLANES = {
                '0x0000': { name: 'BMP', label: '基本多文种平面', range: 'U+0000 – U+FFFF' },
                '0x10000': { name: 'SMP', label: '补充多文种平面', range: 'U+10000 – U+1FFFF' },
                '0x20000': { name: 'SIP', label: '表意文字补充平面', range: 'U+20000 – U+2FFFF' },
                '0x30000': { name: 'TIP', label: '表意文字第三平面', range: 'U+30000 – U+3FFFF' },
                '0x40000': { name: 'Plane 4', label: '预留平面 4', range: 'U+40000 – U+4FFFF' },
                '0x50000': { name: 'Plane 5', label: '预留平面 5', range: 'U+50000 – U+5FFFF' },
                '0x60000': { name: 'Plane 6', label: '预留平面 6', range: 'U+60000 – U+6FFFF' },
                '0x70000': { name: 'Plane 7', label: '预留平面 7', range: 'U+70000 – U+7FFFF' },
                '0x80000': { name: 'Plane 8', label: '预留平面 8', range: 'U+80000 – U+8FFFF' },
                '0x90000': { name: 'Plane 9', label: '预留平面 9', range: 'U+90000 – U+9FFFF' },
                '0xA0000': { name: 'Plane 10', label: '预留平面 10', range: 'U+A0000 – U+AFFFF' },
                '0xB0000': { name: 'Plane 11', label: '预留平面 11', range: 'U+B0000 – U+BFFFF' },
                '0xC0000': { name: 'Plane 12', label: '预留平面 12', range: 'U+C0000 – U+CFFFF' },
                '0xD0000': { name: 'Plane 13', label: '预留平面 13', range: 'U+D0000 – U+DFFFF' },
                '0xE0000': { name: 'SSP', label: '特别用途补充平面', range: 'U+E0000 – U+E0FFF' },
                '0xF0000': { name: 'PUA-A', label: '私有使用区-A', range: 'U+F0000 – U+FFFFF' },
                '0x100000': { name: 'PUA-B', label: '私有使用区-B', range: 'U+100000 – U+10FFFF' }
            };

            function getSortedPlaneKeys() {
                return Object.keys(PLANES).sort((a, b) => parseInt(a) - parseInt(b));
            }

            function getPlaneStartsSorted() {
                return getSortedPlaneKeys().map(key => parseInt(key));
            }

            function getPrevPlaneStart(currentStart) {
                const starts = getPlaneStartsSorted();
                const idx = starts.indexOf(currentStart);
                if (idx > 0) return starts[idx - 1];
                return null;
            }

            function getNextPlaneStart(currentStart) {
                const starts = getPlaneStartsSorted();
                const idx = starts.indexOf(currentStart);
                if (idx < starts.length - 1) return starts[idx + 1];
                return null;
            }

            const CTRL_NAMES = {
                0x00: 'NUL', 0x01: 'SOH', 0x02: 'STX', 0x03: 'ETX', 0x04: 'EOT',
                0x05: 'ENQ', 0x06: 'ACK', 0x07: 'BEL', 0x08: 'BS', 0x09: 'TAB',
                0x0A: 'LF', 0x0B: 'VT', 0x0C: 'FF', 0x0D: 'CR', 0x0E: 'SO',
                0x0F: 'SI', 0x10: 'DLE', 0x11: 'DC1', 0x12: 'DC2', 0x13: 'DC3',
                0x14: 'DC4', 0x15: 'NAK', 0x16: 'SYN', 0x17: 'ETB', 0x18: 'CAN',
                0x19: 'EM', 0x1A: 'SUB', 0x1B: 'ESC', 0x1C: 'FS', 0x1D: 'GS',
                0x1E: 'RS', 0x1F: 'US', 0x7F: 'DEL',
                0x80: 'PAD', 0x81: 'HOP', 0x82: 'BPH', 0x83: 'NBH', 0x84: 'IND',
                0x85: 'NEL', 0x86: 'SSA', 0x87: 'ESA', 0x88: 'HTS', 0x89: 'HTJ',
                0x8A: 'VTS', 0x8B: 'PLD', 0x8C: 'PLU', 0x8D: 'RI', 0x8E: 'SS2',
                0x8F: 'SS3', 0x90: 'DCS', 0x91: 'PU1', 0x92: 'PU2', 0x93: 'STS',
                0x94: 'CCH', 0x95: 'MW', 0x96: 'SPA', 0x97: 'EPA', 0x98: 'SOS',
                0x99: 'SGCI', 0x9A: 'SCI', 0x9B: 'CSI', 0x9C: 'ST', 0x9D: 'OSC',
                0x9E: 'PM', 0x9F: 'APC'
            };

            const TOTAL_PER_PLANE = 0x10000;
            const PAGE_SIZE = 256;
            const TOTAL_PAGES = TOTAL_PER_PLANE / PAGE_SIZE;

            let currentPlaneStart = 0x0000;
            let currentData = [];
            let currentPage = 1;
            let highlightCode = -1;
            const planeDataCache = {};

            let searchOpts = {
                decimal: true,
                hex: true,
                char: true
            };

            const tbody = document.getElementById('resultBody');
            const currentPageDisplay = document.getElementById('currentPageDisplay');
            const totalPagesDisplay = document.getElementById('totalPagesDisplay');
            const pageJump = document.getElementById('pageJump');
            const tableScroll = document.getElementById('tableScroll');
            const mainContent = document.getElementById('mainContent');
            const head = document.getElementById('resultHead');
            const planeSelect = document.getElementById('planeSelect');
            const planeSub = document.getElementById('planeSub');
            const planeDesc = document.getElementById('planeDesc');
            const searchInput = document.getElementById('searchInput');
            const searchMode = document.getElementById('searchMode');
            const copyToast = document.getElementById('copyToast');
            const searchOptionsContainer = document.getElementById('searchOptions');
            const clearSearchBtn = document.getElementById('clearSearchBtn');
            const historyPanel = document.getElementById('historyPanel');
            const historyList = document.getElementById('historyList');
            const clearAllHistoryBtn = document.getElementById('clearAllHistory');
            const searchWrapper = document.getElementById('searchWrapper');
            const prevPageBtn = document.getElementById('prevPage');
            const nextPageBtn = document.getElementById('nextPage');
            const candidatePanel = document.getElementById('candidatePanel');
            const easterEgg = document.getElementById('easterEgg');

            totalPagesDisplay.textContent = TOTAL_PAGES;

            easterEgg.addEventListener('click', function() {
                try {
                    const audio = new Audio('咕咕嘎嘎.mp3');
                    audio.play();
                } catch (e) { console.warn('音频播放失败:', e); }
                alert('🐧咕咕嘎嘎🐧');
            });

            const HISTORY_STORAGE_KEY = 'unicode_viewer_history';
            const MAX_HISTORY = 20;

            function getHistory() {
                try {
                    const data = localStorage.getItem(HISTORY_STORAGE_KEY);
                    return data ? JSON.parse(data) : [];
                } catch { return []; }
            }

            function saveHistory(history) {
                try {
                    localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
                } catch {}
            }

            function addHistory(keyword) {
                if (!keyword.trim()) return;
                let history = getHistory();
                history = history.filter(item => item !== keyword);
                history.unshift(keyword);
                if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
                saveHistory(history);
                renderHistory();
            }

            function removeHistoryItem(keyword) {
                let history = getHistory();
                history = history.filter(item => item !== keyword);
                saveHistory(history);
                renderHistory();
            }

            function clearAllHistory() {
                saveHistory([]);
                renderHistory();
            }

            function renderHistory() {
                const history = getHistory();
                historyList.innerHTML = '';
                if (history.length === 0) {
                    const empty = document.createElement('li');
                    empty.className = 'history-empty';
                    empty.textContent = '暂无搜索记录';
                    historyList.appendChild(empty);
                    return;
                }
                history.forEach(item => {
                    const li = document.createElement('li');
                    const textSpan = document.createElement('span');
                    textSpan.className = 'history-text';
                    textSpan.textContent = item;
                    li.appendChild(textSpan);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-one-btn';
                    delBtn.textContent = '✕';
                    delBtn.title = '删除该条';
                    delBtn.addEventListener('mousedown', function(e) { e.stopPropagation(); });
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        removeHistoryItem(item);
                        if (searchInput.value === item) {
                            searchInput.value = '';
                            updateClearBtn();
                            updatePanels();
                        }
                    });
                    li.appendChild(delBtn);

                    li.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        searchInput.value = item;
                        searchAndLocate(item);
                        historyPanel.classList.remove('active');
                        candidatePanel.classList.remove('active');
                        searchInput.blur();
                        updateClearBtn();
                    });
                    historyList.appendChild(li);
                });
            }

            function updateClearBtn() {
                if (searchInput.value.length > 0) {
                    clearSearchBtn.classList.add('visible');
                } else {
                    clearSearchBtn.classList.remove('visible');
                }
            }

            function updatePanels() {
                const hasFocus = document.activeElement === searchInput;
                if (!hasFocus) {
                    historyPanel.classList.remove('active');
                    candidatePanel.classList.remove('active');
                    return;
                }
                const val = searchInput.value.trim();
                if (val.length === 0) {
                    historyPanel.classList.add('active');
                    candidatePanel.classList.remove('active');
                    renderHistory();
                } else {
                    historyPanel.classList.remove('active');
                    candidatePanel.classList.add('active');
                    renderCandidates(val);
                }
            }

            function renderCandidates(keyword) {
                const mode = searchMode.value;
                const hexEnabled = searchOpts.hex;
                const decEnabled = searchOpts.decimal;
                const charEnabled = searchOpts.char;

                let dataToSearch = [];
                if (mode === 'page') {
                    const startIdx = (currentPage - 1) * PAGE_SIZE;
                    const endIdx = Math.min(startIdx + PAGE_SIZE, currentData.length);
                    dataToSearch = currentData.slice(startIdx, endIdx);
                } else if (mode === 'plane') {
                    dataToSearch = currentData;
                } else {
                    for (const key of Object.keys(PLANES)) {
                        const start = parseInt(key);
                        const data = generatePlaneData(start);
                        dataToSearch = dataToSearch.concat(data);
                    }
                }

                const results = {};

                if (hexEnabled) {
                    const hexList = [];
                    const lowerKw = keyword.toLowerCase();
                    for (const item of dataToSearch) {
                        if (item.hex.toLowerCase().includes(lowerKw)) {
                            hexList.push(item);
                            if (hexList.length >= 10) break;
                        }
                    }
                    results.hex = { items: hexList, total: hexList.length === 10 ? 10 : hexList.length, more: hexList
                            .length === 10 };
                }

                if (decEnabled) {
                    const decList = [];
                    for (const item of dataToSearch) {
                        if (String(item.code).includes(keyword)) {
                            decList.push(item);
                            if (decList.length >= 10) break;
                        }
                    }
                    results.dec = { items: decList, total: decList.length === 10 ? 10 : decList.length, more: decList
                            .length === 10 };
                }

                if (charEnabled) {
                    const charList = [];
                    const lowerKw = keyword.toLowerCase();
                    for (const item of dataToSearch) {
                        const str = (item.char + item.display).toLowerCase();
                        if (str.includes(lowerKw)) {
                            charList.push(item);
                            if (charList.length >= 10) break;
                        }
                    }
                    results.char = { items: charList, total: charList.length === 10 ? 10 : charList.length, more: charList
                            .length === 10 };
                }

                let html = '';
                const sectionOrder = ['hex', 'dec', 'char'];
                const sectionLabels = {
                    hex: '十六进制',
                    dec: '十进制',
                    char: '字符'
                };
                for (const sec of sectionOrder) {
                    if (!results[sec]) continue;
                    const data = results[sec];
                    if (data.items.length === 0) continue;
                    const countDisplay = data.more ? `${data.total}+` : data.total;
                    html += `<div class="candidate-section">
                        <div class="section-title">${sectionLabels[sec]} <span class="count-badge">(${countDisplay})</span></div>
                        <ul class="candidate-list">`;
                    for (const item of data.items) {
                        const charDisplay = item.isCtrl ? item.display : (item.char === ' ' ? '␣' : (item.char === '\xA0' ?
                            ' ' : item.char));
                        const codeHex = '0x' + item.hex;
                        const codeDec = item.code;
                        html += `<li data-code="${item.code}" class="candidate-item">
                            <span class="candidate-char">${charDisplay}</span>
                            <span class="candidate-code">${codeHex} (${codeDec})</span>
                        </li>`;
                    }
                    html += `</ul></div>`;
                }
                if (!html) {
                    html = `<div class="history-empty">无匹配结果</div>`;
                }
                candidatePanel.innerHTML = html;

                candidatePanel.querySelectorAll('.candidate-item').forEach(el => {
                    el.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        const code = parseInt(this.dataset.code);
                        if (!isNaN(code)) {
                            searchAndLocate(code);
                            candidatePanel.classList.remove('active');
                            searchInput.blur();
                        }
                    });
                });
            }

            function generatePlaneData(start) {
                if (planeDataCache[start] !== undefined) {
                    return planeDataCache[start];
                }
                console.time('生成平面数据 ' + start.toString(16));
                const data = [];
                const end = start + TOTAL_PER_PLANE;
                for (let code = start; code < end; code++) {
                    const localCode = code - start;
                    const hex = code.toString(16).toUpperCase().padStart(4, '0');
                    const char = String.fromCodePoint(code);
                    let display = char;
                    let isCtrl = false;
                    if (start === 0x0000) {
                        if (code < 0x20 || (code >= 0x7F && code < 0xA0)) {
                            isCtrl = true;
                            display = CTRL_NAMES[code] || '␀';
                        } else if (code === 0x20) {
                            display = '␣';
                        } else if (code === 0xA0) {
                            display = ' ';
                        }
                    } else {
                        if (code === 0x20 || code === 0xA0) {
                            display = (code === 0x20) ? '␣' : ' ';
                        }
                    }
                    data.push({
                        code: code,
                        localCode: localCode,
                        hex: hex,
                        char: char,
                        display: display,
                        isCtrl: isCtrl
                    });
                }
                console.timeEnd('生成平面数据 ' + start.toString(16));
                planeDataCache[start] = data;
                return data;
            }

            function switchPlane(start, options = {}) {
                const resetHighlight = options.resetHighlight !== undefined ? options.resetHighlight : true;
                const clearSearch = options.clearSearch !== undefined ? options.clearSearch : true;

                currentPlaneStart = start;
                currentData = generatePlaneData(start);

                let key = Object.keys(PLANES).find(k => parseInt(k) === start);
                if (key) {
                    planeSelect.value = key;
                } else {
                    planeSelect.value = '0x' + start.toString(16);
                }

                let planeKey = Object.keys(PLANES).find(key => parseInt(key) === start);
                const planeInfo = PLANES[planeKey] || { name: '未知', label: '未知平面', range: '' };

                document.querySelector('.page-title').textContent = '全 Unicode 平面查看器';
                planeDesc.textContent = planeInfo.label + ' · ' + planeInfo.range + ' · 共 ' + TOTAL_PER_PLANE.toLocaleString() +
                    ' 个字符 · 点击 📋 复制字符';
                planeSub.textContent = planeInfo.name + ' · ' + planeInfo.range;

                if (clearSearch) {
                    searchInput.value = '';
                }
                if (resetHighlight) {
                    highlightCode = -1;
                }
                currentPage = 1;
                renderPage(currentPage);
                updateClearBtn();
                updateNavButtons();
            }

            function updateNavButtons() {
                const isFirstPlaneFirstPage = (currentPlaneStart === 0x0000 && currentPage === 1);
                prevPageBtn.disabled = isFirstPlaneFirstPage;
                prevPageBtn.title = isFirstPlaneFirstPage ? '已是首个平面首页' : '上一页';

                const isLastPlaneLastPage = (currentPlaneStart === 0x100000 && currentPage === TOTAL_PAGES);
                nextPageBtn.disabled = isLastPlaneLastPage;
                nextPageBtn.title = isLastPlaneLastPage ? '已是最后一个平面末页' : '下一页';
            }

            function renderPage(page) {
                if (page < 1) page = 1;
                if (page > TOTAL_PAGES) page = TOTAL_PAGES;
                currentPage = page;
                currentPageDisplay.textContent = currentPage;
                pageJump.value = currentPage;

                const startIdx = (page - 1) * PAGE_SIZE;
                const endIdx = Math.min(startIdx + PAGE_SIZE, currentData.length);

                let html = '';
                for (let row = 0; row < 16; row++) {
                    const rowStart = startIdx + row * 16;
                    if (rowStart >= currentData.length) break;
                    const firstCode = currentData[rowStart].code;
                    const rowHex = (firstCode >> 4).toString(16).toUpperCase().padStart(3, '0');
                    html += '<tr>';
                    html += `<td>${rowHex}</td>`;

                    for (let col = 0; col < 16; col++) {
                        const idx = rowStart + col;
                        if (idx >= currentData.length) break;
                        const item = currentData[idx];
                        const { code, hex, display, isCtrl, char } = item;

                        let charHtml = '';
                        if (isCtrl) {
                            charHtml = `<span class="ctrl-char" title="控制字符 ${hex}">${display}</span>`;
                        } else {
                            if (code === 0x20) {
                                charHtml = `<span class="empty-placeholder">␣</span>`;
                            } else if (code === 0xA0) {
                                charHtml = `<span class="empty-placeholder"> </span>`;
                            } else {
                                charHtml = display;
                            }
                        }

                        const highlightClass = (code === highlightCode) ? ' highlight-cell' : '';
                        const copyBtn = `<span class="copy-btn" data-code="${code}" title="复制字符">📋</span>`;

                        html += `<td class="${highlightClass}">
                                    <div class="unicode_str">
                                        ${charHtml}
                                        ${copyBtn}
                                    </div>
                                    <div class="unicode_hex">${hex}</div>
                                    <div class="unicode_decimal">${code}</div>
                                </td>`;
                    }
                    html += '</tr>';
                }
                tbody.innerHTML = html;

                if (highlightCode !== -1) {
                    const highEl = tbody.querySelector('.highlight-cell');
                    if (highEl) {
                        highEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                }
                updateShadow();
                updateNavButtons();
            }

            tbody.addEventListener('click', function(e) {
                const btn = e.target.closest('.copy-btn');
                if (!btn) return;
                const code = parseInt(btn.dataset.code);
                if (isNaN(code)) return;
                let char;
                try {
                    char = String.fromCodePoint(code);
                } catch (_) { char = ''; }
                if (!char) {
                    showToast('⚠️ 无法复制该字符');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(char)
                        .then(() => {
                            showToast('✅ 已复制: ' + (char.length === 1 ? char : '特殊字符'));
                            btn.classList.add('copied');
                            btn.textContent = '✓';
                            setTimeout(() => {
                                btn.classList.remove('copied');
                                btn.textContent = '📋';
                            }, 1200);
                        })
                        .catch(() => { fallbackCopy(char, btn); });
                } else {
                    fallbackCopy(char, btn);
                }
            });

            function fallbackCopy(text, btn) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('✅ 已复制: ' + (text.length === 1 ? text : '特殊字符'));
                    btn.classList.add('copied');
                    btn.textContent = '✓';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.textContent = '📋';
                    }, 1200);
                } catch (_) {
                    showToast('❌ 复制失败，请手动选择复制');
                }
            }

            let toastTimer = null;

            function showToast(msg) {
                copyToast.textContent = msg;
                copyToast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    copyToast.classList.remove('show');
                }, 2000);
            }

            searchOptionsContainer.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const opt = btn.dataset.opt;
                if (!opt) return;
                btn.classList.toggle('active');
                searchOpts[opt] = btn.classList.contains('active');
                if (document.activeElement === searchInput && searchInput.value.trim()) {
                    renderCandidates(searchInput.value.trim());
                }
            });

            function searchAndLocate(keyword) {
                let kw = keyword;
                if (typeof keyword === 'number') {
                    kw = keyword.toString(16).toUpperCase();
                }
                if (typeof kw !== 'string') kw = String(kw);
                const trimmed = kw.trim();
                if (!trimmed) {
                    highlightCode = -1;
                    renderPage(1);
                    return;
                }

                addHistory(trimmed);

                const hexEnabled = searchOpts.hex;
                const decEnabled = searchOpts.decimal;
                const charEnabled = searchOpts.char;

                if (!hexEnabled && !decEnabled && !charEnabled) {
                    alert('请至少启用一种搜索方式（十进制、十六进制或字符）');
                    return;
                }

                const mode = searchMode.value;

                let targetCode = -1;
                if (hexEnabled) {
                    let hexStr = trimmed;
                    let isHex = false;
                    if (/^0x[0-9a-f]{1,6}$/i.test(trimmed)) {
                        hexStr = trimmed.slice(2);
                        isHex = true;
                    } else if (/^[0-9a-f]{1,6}$/i.test(trimmed)) {
                        isHex = true;
                    }
                    if (isHex) {
                        const parsed = parseInt(hexStr, 16);
                        if (!isNaN(parsed) && parsed >= 0 && parsed <= 0x10FFFF) {
                            targetCode = parsed;
                        }
                    }
                }
                if (targetCode === -1 && decEnabled) {
                    if (/^[0-9]+$/.test(trimmed)) {
                        const parsed = parseInt(trimmed, 10);
                        if (!isNaN(parsed) && parsed >= 0 && parsed <= 0x10FFFF) {
                            targetCode = parsed;
                        }
                    }
                }

                if (targetCode !== -1) {
                    let allowJump = false;
                    if (mode === 'all') {
                        allowJump = true;
                    } else if (mode === 'plane') {
                        if (targetCode >= currentPlaneStart && targetCode < currentPlaneStart + TOTAL_PER_PLANE) {
                            allowJump = true;
                        }
                    } else if (mode === 'page') {
                        const startIdx = (currentPage - 1) * PAGE_SIZE;
                        const endIdx = Math.min(startIdx + PAGE_SIZE, currentData.length);
                        for (let i = startIdx; i < endIdx; i++) {
                            if (currentData[i].code === targetCode) {
                                allowJump = true;
                                break;
                            }
                        }
                    }
                    if (allowJump) {
                        let foundPlane = -1;
                        for (const key of Object.keys(PLANES)) {
                            const start = parseInt(key);
                            if (targetCode >= start && targetCode < start + TOTAL_PER_PLANE) {
                                foundPlane = start;
                                break;
                            }
                        }
                        if (foundPlane !== -1) {
                            highlightCode = targetCode;
                            if (foundPlane !== currentPlaneStart) {
                                switchPlane(foundPlane, { resetHighlight: false, clearSearch: false });
                                const page = Math.floor((targetCode - foundPlane) / PAGE_SIZE) + 1;
                                currentPage = page;
                                renderPage(page);
                            } else {
                                const page = Math.floor((targetCode - currentPlaneStart) / PAGE_SIZE) + 1;
                                currentPage = page;
                                renderPage(page);
                            }
                            return;
                        } else {
                            alert('该码位位于未定义的平面，暂不支持查看');
                            return;
                        }
                    } else {
                        alert('在当前搜索范围内未找到该码位');
                        return;
                    }
                }

                if (!charEnabled) {
                    alert('未找到匹配的码位，请检查输入或启用"字符"搜索进行模糊匹配。');
                    return;
                }

                function findInData(data, kw) {
                    for (let i = 0; i < data.length; i++) {
                        const item = data[i];
                        if (item.char === kw || (item.display !== item.char && item.display === kw)) {
                            return item;
                        }
                    }
                    const lowerKw = kw.toLowerCase();
                    for (let i = 0; i < data.length; i++) {
                        const item = data[i];
                        const str = item.char + item.display;
                        if (str.toLowerCase().includes(lowerKw)) {
                            return item;
                        }
                    }
                    return null;
                }

                let foundItem = null;
                if (mode === 'page') {
                    const startIdx = (currentPage - 1) * PAGE_SIZE;
                    const endIdx = Math.min(startIdx + PAGE_SIZE, currentData.length);
                    const pageData = currentData.slice(startIdx, endIdx);
                    foundItem = findInData(pageData, trimmed);
                    if (foundItem) {
                        highlightCode = foundItem.code;
                        renderPage(currentPage);
                        return;
                    }
                    alert('当前页未找到匹配字符');
                } else if (mode === 'plane') {
                    foundItem = findInData(currentData, trimmed);
                    if (foundItem) {
                        highlightCode = foundItem.code;
                        const page = Math.floor((foundItem.code - currentPlaneStart) / PAGE_SIZE) + 1;
                        currentPage = page;
                        renderPage(page);
                        return;
                    }
                    alert('当前平面未找到匹配字符');
                } else {
                    for (const key of Object.keys(PLANES)) {
                        const start = parseInt(key);
                        const data = generatePlaneData(start);
                        foundItem = findInData(data, trimmed);
                        if (foundItem) {
                            highlightCode = foundItem.code;
                            if (start !== currentPlaneStart) {
                                switchPlane(start, { resetHighlight: false, clearSearch: false });
                            }
                            const page = Math.floor((foundItem.code - start) / PAGE_SIZE) + 1;
                            currentPage = page;
                            renderPage(page);
                            return;
                        }
                    }
                    alert('所有已定义字符集中未找到匹配字符');
                }
            }

            function goToPage(page) {
                if (page < 1) page = 1;
                if (page > TOTAL_PAGES) page = TOTAL_PAGES;
                if (page !== currentPage) {
                    highlightCode = -1;
                }
                renderPage(page);
            }

            planeSelect.addEventListener('change', function() {
                const val = this.value;
                const start = parseInt(val);
                if (!isNaN(start) && start !== currentPlaneStart) {
                    switchPlane(start);
                }
            });

            prevPageBtn.addEventListener('click', function() {
                if (this.disabled) return;
                if (currentPage > 1) {
                    goToPage(currentPage - 1);
                } else {
                    const prevStart = getPrevPlaneStart(currentPlaneStart);
                    if (prevStart !== null) {
                        switchPlane(prevStart, { resetHighlight: true, clearSearch: true });
                        renderPage(TOTAL_PAGES);
                    }
                }
            });

            nextPageBtn.addEventListener('click', function() {
                if (this.disabled) return;
                if (currentPage < TOTAL_PAGES) {
                    goToPage(currentPage + 1);
                } else {
                    const nextStart = getNextPlaneStart(currentPlaneStart);
                    if (nextStart !== null) {
                        switchPlane(nextStart, { resetHighlight: true, clearSearch: true });
                        renderPage(1);
                    }
                }
            });

            document.getElementById('jumpBtn').addEventListener('click', function() {
                let p = parseInt(pageJump.value);
                if (isNaN(p) || p < 1) p = 1;
                if (p > TOTAL_PAGES) p = TOTAL_PAGES;
                goToPage(p);
            });
            pageJump.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('jumpBtn').click();
                }
            });

            // 失焦时恢复当前页码（不触发跳转）
            pageJump.addEventListener('blur', function() {
                this.value = currentPage;
            });

            document.getElementById('firstPageBtn').addEventListener('click', function() {
                goToPage(1);
            });
            document.getElementById('lastPageBtn').addEventListener('click', function() {
                goToPage(TOTAL_PAGES);
            });

            document.getElementById('searchBtn').addEventListener('click', function() {
                const val = searchInput.value;
                searchAndLocate(val);
                historyPanel.classList.remove('active');
                candidatePanel.classList.remove('active');
                searchInput.blur();
            });

            searchInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    const val = searchInput.value;
                    searchAndLocate(val);
                    historyPanel.classList.remove('active');
                    candidatePanel.classList.remove('active');
                    searchInput.blur();
                }
            });

            clearSearchBtn.addEventListener('click', function() {
                searchInput.value = '';
                updateClearBtn();
                highlightCode = -1;
                renderPage(currentPage);
                candidatePanel.classList.remove('active');
                searchInput.focus();
            });

            searchInput.addEventListener('input', function() {
                updateClearBtn();
                updatePanels();
            });

            searchInput.addEventListener('focus', function() {
                updatePanels();
            });

            searchInput.addEventListener('blur', function() {
                setTimeout(() => {
                    if (document.activeElement === searchInput) {
                        return;
                    }
                    historyPanel.classList.remove('active');
                    candidatePanel.classList.remove('active');
                }, 150);
            });

            document.addEventListener('click', function(e) {
                if (!searchWrapper.contains(e.target)) {
                    historyPanel.classList.remove('active');
                    candidatePanel.classList.remove('active');
                }
            });

            clearAllHistoryBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                clearAllHistory();
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                searchInput.value = '';
                updateClearBtn();
                highlightCode = -1;
                const btns = searchOptionsContainer.querySelectorAll('.opt-btn');
                btns.forEach(btn => {
                    btn.classList.add('active');
                    searchOpts[btn.dataset.opt] = true;
                });
                searchMode.value = 'plane';
                renderPage(1);
                historyPanel.classList.remove('active');
                candidatePanel.classList.remove('active');
                searchInput.blur();
            });

            function updateShadow() {
                if (mainContent.scrollTop > 10 || tableScroll.scrollTop > 10) {
                    head.classList.add('scrolled');
                } else {
                    head.classList.remove('scrolled');
                }
            }
            mainContent.addEventListener('scroll', updateShadow);
            tableScroll.addEventListener('scroll', updateShadow);

            // 行高亮交互：点击已高亮行则取消高亮，否则高亮该行
            tbody.addEventListener('click', function(e) {
                if (e.target.closest('.copy-btn')) return;
                const td = e.target.closest('td');
                if (!td) return;
                const tr = td.closest('tr');
                if (!tr) return;
                if (tr.classList.contains('highlight-row')) {
                    tr.classList.remove('highlight-row');
                } else {
                    document.querySelectorAll('#resultBody tr.highlight-row')
                        .forEach(r => r.classList.remove('highlight-row'));
                    tr.classList.add('highlight-row');
                }
            });

            function populatePlaneSelect() {
                planeSelect.innerHTML = '';
                const sortedKeys = getSortedPlaneKeys();
                sortedKeys.forEach(key => {
                    const info = PLANES[key];
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = info.label + ' (' + info.name + ')';
                    planeSelect.appendChild(opt);
                });
            }

            // ================================================================
            // 3. 启动
            // ================================================================
            initTheme();
            populatePlaneSelect();
            switchPlane(0x0000);
            updateClearBtn();
            renderHistory();
            console.log('✅ 全部功能已加载，主题切换动画已优化，跳转标签颜色已修复，输入框失焦复位');
        })();
    </script>

</body>
